<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <title>YouTube MP3 Downloader</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{

            font-family:Arial,sans-serif;

            background:#f4f6f9;

            display:flex;

            justify-content:center;

            align-items:center;

            min-height:100vh;
        }

        .container{

            width:700px;

            background:white;

            padding:40px;

            border-radius:20px;

            box-shadow:0 10px 30px rgba(0,0,0,0.1);

            text-align:center;
        }

        h1{

            margin-bottom:15px;
        }

        h3{

            margin-bottom:20px;

            color:#666;

            min-height:24px;
        }

        input{

            width:100%;

            padding:15px;

            border:1px solid #ddd;

            border-radius:10px;

            font-size:16px;
        }

        button{

            margin-top:15px;

            width:100%;

            padding:15px;

            border:none;

            border-radius:10px;

            font-size:16px;

            cursor:pointer;

            background:#2563eb;

            color:white;
        }

        button:hover{

            opacity:.9;
        }

        #progressBar{

            width:100%;

            height:25px;

            background:#eee;

            border-radius:20px;

            overflow:hidden;

            margin-top:20px;

            display:none;
        }

        #progress{

            width:0%;

            height:100%;

            background:#22c55e;

            transition:.3s;
        }

        #status{

            margin-top:15px;

            font-size:18px;

            font-weight:bold;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>🎵 YouTube MP3 Downloader</h1>

    <h3 id="title"></h3>

    <input
        id="url"
        type="text"
        placeholder="Dán link YouTube..."
    >

    <button onclick="downloadMusic()">
        Tải MP3
    </button>

    <div id="progressBar">

        <div id="progress"></div>

    </div>

    <h2 id="status"></h2>

</div>

<script>

async function checkProgress(){

    const response =
        await fetch("/progress")

    const data =
        await response.json()

    document.getElementById("status")
        .innerText =
        data.progress

    document.getElementById("progress")
        .style.width =
        data.progress

    if(data.filename){

        document.getElementById("title")
            .innerText =
            data.filename.replace(".mp3","")

    }

    if(data.finished){

        document.getElementById("status")
            .innerText =
            "✅ Hoàn thành"

        setTimeout(()=>{

            window.location.href =
                "/downloads/" + data.filename

        },1000)

    }else{

        setTimeout(checkProgress,1000)

    }

}

async function downloadMusic(){

    const url =
        document.getElementById("url").value

    if(!url){

        alert("Vui lòng nhập link YouTube")

        return
    }

    document.getElementById("progressBar")
        .style.display =
        "block"

    document.getElementById("progress")
        .style.width =
        "0%"

    document.getElementById("status")
        .innerText =
        "Bắt đầu..."

    document.getElementById("title")
        .innerText =
        ""

    await fetch(
        "/download?url=" +
        encodeURIComponent(url)
    )

    checkProgress()

}

</script>

</body>

</html>
